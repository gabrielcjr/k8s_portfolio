# HTTP Server for Leilões Judiciais (Redirect all traffic to HTTPS)
server {
    listen 80;
    server_name leiloes.gabrielcjr.website;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50M;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: leiloes.gabrielcjr.website
server {
    listen 443 ssl http2;
    server_name leiloes.gabrielcjr.website;

    ssl_certificate /etc/letsencrypt/live/leiloes.gabrielcjr.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leiloes.gabrielcjr.website/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_LEILOES:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME Challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reverse Proxy to K3s Leilões NodePort 30093
    location / {
        proxy_pass http://127.0.0.1:30093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
