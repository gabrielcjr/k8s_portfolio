# SigNoz K8s-Infra - Lightweight Log & Event Collector for K3s
global:
  clusterName: "k3s-portfolio"

otelCollectorEndpoint: "signoz-otel-collector.signoz.svc.cluster.local:4317"
otelInsecure: true

presets:
  logsCollection:
    enabled: true
    startAt: end
    includeFilePath: true
    blacklist:
      enabled: true
      signozLogs: false
      namespaces:
        - kube-system
  otlpExporter:
    enabled: true
  otlphttpExporter:
    enabled: false
  k8sEvents:
    enabled: true
  clusterMetrics:
    enabled: false
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  resourceDetection:
    enabled: true

otelDeployment:
  enabled: false

otelAgent:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 80Mi
    limits:
      cpu: 200m
      memory: 250Mi
