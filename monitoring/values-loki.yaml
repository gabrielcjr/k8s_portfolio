# Loki & Promtail Stack - Lightweight K3s Configuration
loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

promtail:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 100Mi

fluent-bit:
  enabled: false

grafana:
  enabled: false

prometheus:
  enabled: false

filebeat:
  enabled: false

logstash:
  enabled: false
