# SigNoz - Lightweight Observability configuration for K3s (Single Node)
global:
  storageClass: local-path

clickhouse:
  enabled: true
  layout:
    shardsCount: 1
    replicasCount: 1
  persistence:
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2048Mi
  zookeeper:
    enabled: true
    replicaCount: 1
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi

signoz:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 384Mi
  service:
    type: NodePort
    port: 8080
    nodePort: 30301

otelCollector:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 384Mi

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - events
          - namespaces
          - namespaces/status
          - nodes
          - nodes/spec
          - pods
          - pods/status
          - replicationcontrollers
          - replicationcontrollers/status
          - resourcequotas
          - services
          - nodes/stats
          - nodes/proxy
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources:
          - daemonsets
          - daemonsets/status
          - deployments
          - deployments/status
          - replicasets
          - replicasets/status
          - statefulsets
          - statefulsets/status
        verbs: ["get", "list", "watch"]
      - apiGroups: ["batch"]
        resources: ["jobs", "cronjobs"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["autoscaling"]
        resources: ["horizontalpodautoscalers"]
        verbs: ["get", "list", "watch"]

  config:
    connectors:
      signozmeter:
        dimensions:
          - name: service.name
          - name: deployment.environment
          - name: host.name
        metrics_flush_interval: 1h

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      httplogreceiver/heroku:
        endpoint: 0.0.0.0:8081
        source: heroku
      httplogreceiver/json:
        endpoint: 0.0.0.0:8082
        source: json
      hostmetrics:
        collection_interval: 15s
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
      k8s_cluster:
        collection_interval: 30s
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 20s
        endpoint: https://10.0.0.197:10250
        insecure_skip_verify: true
      postgresql:
        collection_interval: 30s
        databases:
          - jobs_db
        endpoint: postgres.jobs.svc:5432
        password: postgrespassword
        tls:
          insecure: true
        transport: tcp
        username: postgres

    processors:
      batch:
        send_batch_size: 50000
        timeout: 1s
      batch/meter:
        send_batch_max_size: 25000
        send_batch_size: 20000
        timeout: 1s
      resource/host:
        attributes:
          - action: insert
            key: host.name
            value: instance-20221110-1022
          - action: insert
            key: k8s.cluster.name
            value: k3s-portfolio
          - action: insert
            key: k8s.node.name
            value: instance-20221110-1022
      signozspanmetrics/delta:
        aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
        dimensions:
          - default: default
            name: service.namespace
          - default: default
            name: deployment.environment
          - name: signoz.collector.id
        dimensions_cache_size: 100000
        latency_histogram_buckets:
          - 100us
          - 1ms
          - 2ms
          - 6ms
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1000ms
          - 1400ms
          - 2000ms
          - 5s
          - 10s
          - 20s
          - 40s
          - 60s
        metrics_exporter: signozclickhousemetrics

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: localhost:55679
      pprof:
        endpoint: localhost:1777

    exporters:
      clickhousetraces:
        datasource: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_TRACE_DATABASE}
        low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
        use_new_schema: true
      signozclickhousemetrics:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_DATABASE}
        timeout: 45s
      clickhouselogsexporter:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_LOG_DATABASE}
        timeout: 10s
        use_new_schema: true
      metadataexporter:
        enabled: true
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/signoz_metadata
        timeout: 10s
        tenant_id: ${env:TENANT_ID}
        cache:
          provider: in_memory
      signozclickhousemeter:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_METER_DATABASE}
        timeout: 45s
        sending_queue:
          enabled: false

    service:
      telemetry:
        logs:
          encoding: json
      extensions:
        - health_check
        - zpages
        - pprof
      pipelines:
        traces:
          receivers:
            - otlp
            - jaeger
          processors:
            - signozspanmetrics/delta
            - batch
          exporters:
            - clickhousetraces
            - metadataexporter
            - signozmeter
        metrics:
          receivers:
            - otlp
            - hostmetrics
            - k8s_cluster
            - kubeletstats
            - postgresql
          processors:
            - resource/host
            - batch
          exporters:
            - metadataexporter
            - signozclickhousemetrics
            - signozmeter
        metrics/meter:
          receivers:
            - signozmeter
          processors:
            - batch/meter
          exporters:
            - signozclickhousemeter
        logs:
          receivers:
            - otlp
            - httplogreceiver/heroku
            - httplogreceiver/json
          processors:
            - batch
          exporters:
            - clickhouselogsexporter
            - metadataexporter
            - signozmeter

postgresql:
  enabled: false
redpanda:
  enabled: false
signoz-otel-gateway:
  enabled: false
